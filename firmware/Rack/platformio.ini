; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; У нас два независимых теста в src/, у каждого своя setup()/loop():
;   main.cpp      — все компоненты кроме NEMA (зуммер, концевики, PIR, 28BYJ-48)
;   nema_test.cpp — только NEMA 17 / DRV8825
; Поэтому в каждом env подключаем ТОЛЬКО нужный файл через build_src_filter.
; Собрать/залить:
;   pio run -e uno_components -t upload   # основной тест
;   pio run -e uno_nema       -t upload   # тест NEMA
[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; Библиотека шагового двигателя (для 28BYJ-48 через ULN2003)
lib_deps = arduino-libraries/Stepper@^1.1.3

[env:uno]
build_src_filter = +<main.cpp>

[env:uno_components]
build_src_filter = +<main.cpp>

[env:uno_nema]
build_src_filter = +<nema_test.cpp>
; Увеличенные буферы Serial — иначе при 9600 теряются символы
; и "работает только первая команда".
build_flags = -DSERIAL_RX_BUFFER_SIZE=256 -DSERIAL_TX_BUFFER_SIZE=256

; Непрерывное вращение интервалами по 10 секунд (см. src/nema_spin.cpp)
;   pio run -e uno_spin -t upload
[env:uno_spin]
build_src_filter = +<nema_spin.cpp>
build_flags = -DSERIAL_RX_BUFFER_SIZE=256 -DSERIAL_TX_BUFFER_SIZE=256

